name: Landing page

# Disabled. Cloudflare builds and deploys the landing page.
# Uncomment the triggers below to restore this workflow.
# on:
#   # Cloudflare handles automatic landing-page builds/deploys; this workflow
#   # is the PR gate (lint, unit tests, e2e) plus manual verification/deploy.
#   # Path-filtered so a PR that never touches landing-page/ doesn't pay for
#   # a Chromium install it has no use for.
#   pull_request:
#     paths:
#       - "landing-page/**"
#       - ".github/workflows/landing-page.yml"
#   push:
#     branches: [main]
#     paths:
#       - "landing-page/**"
#       - ".github/workflows/landing-page.yml"
#   workflow_dispatch:
#     inputs:
#       deploy:
#         type: choice
#         options: [none, preview, production]
#         default: none

concurrency:
  group: landing-page-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'workflow_call' }}

permissions:
  contents: read

env:
  ASTRO_TELEMETRY_DISABLED: "1"
  WRANGLER_SEND_METRICS: "false"

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: landing-page
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: landing-page/package-lock.json

      - name: Install
        run: npm ci

      - name: Check
        run: npm run check

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: End-to-end tests
        run: npm run test:e2e

      - name: Upload verification artifacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: landing-page-verification
          path: |
            landing-page/artifacts
            landing-page/test-results
          retention-days: 7

  deploy:
    name: Deploy
    needs: verify
    if: github.event_name == 'workflow_dispatch' && inputs.deploy != 'none'
    environment: ${{ inputs.deploy }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: landing-page
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      PUBLIC_GA4_ID: ${{ vars.PUBLIC_GA4_ID }}
      DEPLOY_TARGET: ${{ inputs.deploy }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: landing-page/package-lock.json

      - name: Install
        run: npm ci

      - name: Deploy
        run: npm run "deploy:$DEPLOY_TARGET"
