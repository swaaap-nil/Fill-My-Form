name: Landing page
on:
  pull_request:
    paths: ['landing-page/**', '.github/workflows/landing-page.yml']
  push:
    branches: [main]
    paths: ['landing-page/**', '.github/workflows/landing-page.yml']
  workflow_dispatch:
    inputs:
      deploy:
        type: choice
        options: [none, preview, production]
        default: none
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: landing-page
    env:
      ASTRO_TELEMETRY_DISABLED: '1'
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: landing-page/package-lock.json
      - run: npm ci
      - run: npm run check && npm test && npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: landing-page-verification
          path: |
            landing-page/artifacts
            landing-page/test-results
  deploy:
    needs: verify
    if: github.event_name == 'workflow_dispatch' && inputs.deploy != 'none'
    environment: ${{ inputs.deploy }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: landing-page
    env:
      ASTRO_TELEMETRY_DISABLED: '1'
      WRANGLER_SEND_METRICS: 'false'
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      PUBLIC_SITE_URL: ${{ vars.PUBLIC_SITE_URL }}
      PUBLIC_CHROME_STORE_URL: ${{ vars.PUBLIC_CHROME_STORE_URL }}
      PUBLIC_FIREFOX_STORE_URL: ${{ vars.PUBLIC_FIREFOX_STORE_URL }}
      FIREFOX_VERIFIED: ${{ vars.FIREFOX_VERIFIED }}
      PUBLIC_GA4_ID: ${{ vars.PUBLIC_GA4_ID }}
      LAUNCH_REVIEWED: ${{ vars.LAUNCH_REVIEWED }}
      DEPLOY_TARGET: ${{ inputs.deploy }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: landing-page/package-lock.json
      - run: npm ci
      - run: npm run "deploy:$DEPLOY_TARGET"
