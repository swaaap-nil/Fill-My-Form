name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

env:
  NODE_VERSION: 24.x

jobs:
  verify:
    name: Verify Release Version
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup
        uses: ./.github/workflows/setup
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Check tag and published versions
        run: bun run scripts/release-version.ts

  # Tags are only ever pushed at a commit that release-please just merged to
  # main, and that push already ran tests.yml in full (including the slow
  # e2e job). Re-running it here would just repeat that on the identical
  # SHA, so skip it when a passing run is already on record — and fall back
  # to running it when there isn't one (e.g. a manually pushed tag).
  check-existing-ci:
    name: Check Existing CI
    runs-on: ubuntu-latest
    needs: [verify]
    outputs:
      passed: ${{ steps.check.outputs.passed }}
    steps:
      - name: Check for a passing CI run on this commit
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          conclusion=$(gh api "repos/${REPO}/actions/workflows/tests.yml/runs?head_sha=${SHA}&status=success" --jq '.workflow_runs[0].conclusion // ""')
          if [ "$conclusion" = "success" ]; then
            echo "passed=true" >> "$GITHUB_OUTPUT"
          else
            echo "passed=false" >> "$GITHUB_OUTPUT"
          fi

  tests:
    name: Tests
    needs: [check-existing-ci]
    if: needs.check-existing-ci.outputs.passed != 'true'
    uses: ./.github/workflows/tests.yml

  build:
    name: Build Release Artifacts
    runs-on: ubuntu-latest
    needs: [check-existing-ci, tests]
    if: |
      always() &&
      needs.check-existing-ci.result == 'success' &&
      (needs.tests.result == 'success' || needs.tests.result == 'skipped')
    outputs:
      chrome_zip: ${{ steps.artifacts.outputs.chrome_zip }}
      firefox_zip: ${{ steps.artifacts.outputs.firefox_zip }}
      sources_zip: ${{ steps.artifacts.outputs.sources_zip }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup
        uses: ./.github/workflows/setup
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Build Chrome, Firefox and sources zips
        run: bun run build

      - name: Assert no secrets were bundled
        run: bun run scripts/check-bundle-secrets.ts

      - name: Assert release manifests are clean
        run: bun run scripts/check-release-manifest.ts

      - name: Resolve artifact paths
        id: artifacts
        run: bun run scripts/release-artifacts.ts

      - name: Upload Chrome artifact
        uses: actions/upload-artifact@v7
        with:
          name: chrome-${{ github.ref_name }}
          path: ${{ steps.artifacts.outputs.chrome_zip }}

      - name: Upload Firefox artifact
        uses: actions/upload-artifact@v7
        with:
          name: firefox-${{ github.ref_name }}
          path: ${{ steps.artifacts.outputs.firefox_zip }}

      - name: Upload source artifact
        uses: actions/upload-artifact@v7
        with:
          name: sources-${{ github.ref_name }}
          path: ${{ steps.artifacts.outputs.sources_zip }}

