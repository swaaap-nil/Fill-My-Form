name: Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Version bump. none keeps the current version and still builds and submits.
        type: choice
        options: [patch, minor, major, none]
        default: patch
        required: true

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write
  actions: read

jobs:
  check-existing-ci:
    name: Check existing CI
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      passed: ${{ steps.check.outputs.passed }}
    steps:
      - name: Require main
        run: |
          if [ "${GITHUB_REF}" != "refs/heads/main" ]; then
            echo "Release can only run from main (got ${GITHUB_REF})."
            exit 1
          fi

      - name: Check for a passing CI run on this commit
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          conclusion=$(gh api "repos/${REPO}/actions/workflows/ci.yml/runs?head_sha=${SHA}&status=success&per_page=1" --jq '.workflow_runs[0].conclusion // ""')
          if [ "$conclusion" = "success" ]; then
            echo "passed=true" >> "$GITHUB_OUTPUT"
          else
            echo "passed=false" >> "$GITHUB_OUTPUT"
          fi

  tests:
    name: Tests
    needs: [check-existing-ci]
    if: needs.check-existing-ci.outputs.passed != 'true'
    uses: ./.github/workflows/ci.yml

  prepare:
    name: Prepare
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [check-existing-ci, tests]
    # Tests is skipped when CI already passed. GitHub treats a skipped
    # dependency as a failure unless this job opts back in with always().
    if: |
      always() &&
      needs.check-existing-ci.result == 'success' &&
      (needs.tests.result == 'success' || needs.tests.result == 'skipped')
    outputs:
      version: ${{ steps.bump.outputs.version }}
      tag: ${{ steps.bump.outputs.tag }}
      ref: ${{ steps.bump.outputs.ref }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ secrets.RELEASE_TOKEN || secrets.RELEASE_PLEASE_TOKEN || github.token }}

      - name: Setup
        uses: ./.github/actions/setup

      - name: Resolve version
        id: bump
        run: bun run scripts/release-version.ts bump "${BUMP}"
        env:
          BUMP: ${{ inputs.bump }}

      - name: Write changelog
        if: inputs.bump != 'none'
        run: bun run scripts/release-notes.ts --version "${{ steps.bump.outputs.version }}"

      - name: Commit, tag and push
        if: inputs.bump != 'none'
        env:
          VERSION: ${{ steps.bump.outputs.version }}
          TAG: ${{ steps.bump.outputs.tag }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json CHANGELOG.md
          HUSKY=0 git commit -m "chore(release): ${VERSION}"
          git tag "${TAG}"
          git push origin "HEAD:${GITHUB_REF_NAME}" --tags

      - name: Ensure tag exists
        if: inputs.bump == 'none'
        env:
          TAG: ${{ steps.bump.outputs.tag }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git rev-parse "refs/tags/${TAG}" >/dev/null 2>&1; then
            echo "Tag ${TAG} already exists."
          else
            git tag "${TAG}" "${GITHUB_SHA}"
            git push origin "refs/tags/${TAG}"
          fi

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.bump.outputs.tag }}
        run: |
          if gh release view "${TAG}" >/dev/null 2>&1; then
            echo "GitHub release ${TAG} already exists."
            exit 0
          fi
          if [ -f RELEASE_NOTES.md ]; then
            gh release create "${TAG}" --title "${TAG}" --notes-file RELEASE_NOTES.md
          else
            gh release create "${TAG}" --title "${TAG}" --generate-notes
          fi

  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [prepare]
    # Tests is skipped when CI already passed. That skip poisons the default
    # success() check for every descendant, even after Prepare ran.
    if: always() && needs.prepare.result == 'success'
    outputs:
      chrome_zip: ${{ steps.artifacts.outputs.chrome_zip }}
      firefox_zip: ${{ steps.artifacts.outputs.firefox_zip }}
      sources_zip: ${{ steps.artifacts.outputs.sources_zip }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.ref }}

      - name: Setup
        uses: ./.github/actions/setup

      - name: Build Chrome, Firefox and sources zips
        run: bun run build

      - name: Assert no secrets were bundled
        run: bun run scripts/check-bundle-secrets.ts

      - name: Assert release manifests are clean
        run: bun run scripts/check-release-manifest.ts

      - name: Resolve artifact paths
        id: artifacts
        run: bun run scripts/release-artifacts.ts

      - name: Upload Chrome artifact
        uses: actions/upload-artifact@v7
        with:
          name: chrome-${{ needs.prepare.outputs.tag }}
          path: ${{ steps.artifacts.outputs.chrome_zip }}

      - name: Upload Firefox artifact
        uses: actions/upload-artifact@v7
        with:
          name: firefox-${{ needs.prepare.outputs.tag }}
          path: ${{ steps.artifacts.outputs.firefox_zip }}

      - name: Upload source artifact
        uses: actions/upload-artifact@v7
        with:
          name: sources-${{ needs.prepare.outputs.tag }}
          path: ${{ steps.artifacts.outputs.sources_zip }}

      - name: Attach zips to the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          gh release upload "${TAG}" --clobber \
            "${{ steps.artifacts.outputs.chrome_zip }}" \
            "${{ steps.artifacts.outputs.firefox_zip }}" \
            "${{ steps.artifacts.outputs.sources_zip }}"

  # Chrome Web Store submission stays off until the CWS developer account
  # exists. Re-enable with the same dry-run-then-submit shape as Firefox,
  # using `wxt submit --chrome-zip`. See docs/store/submission-log.md.

  submit-firefox:
    name: Submit Firefox
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [prepare, build]
    if: always() && needs.build.result == 'success'
    environment: Production
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.ref }}

      - name: Setup
        uses: ./.github/actions/setup

      - name: Download Firefox artifact
        uses: actions/download-artifact@v7
        with:
          name: firefox-${{ needs.prepare.outputs.tag }}
          path: build

      - name: Download source artifact
        uses: actions/download-artifact@v7
        with:
          name: sources-${{ needs.prepare.outputs.tag }}
          path: build

      - name: Dry-run Firefox submission
        run: bun run scripts/submit-firefox.ts --dry-run
        env:
          FIREFOX_ZIP: ${{ needs.build.outputs.firefox_zip }}
          FIREFOX_SOURCES_ZIP: ${{ needs.build.outputs.sources_zip }}
          FIREFOX_EXTENSION_ID: ${{ secrets.FIREFOX_EXTENSION_ID }}
          FIREFOX_JWT_ISSUER: ${{ secrets.FIREFOX_JWT_ISSUER }}
          FIREFOX_JWT_SECRET: ${{ secrets.FIREFOX_JWT_SECRET }}

      - name: Submit Firefox
        run: bun run scripts/submit-firefox.ts
        env:
          FIREFOX_ZIP: ${{ needs.build.outputs.firefox_zip }}
          FIREFOX_SOURCES_ZIP: ${{ needs.build.outputs.sources_zip }}
          FIREFOX_EXTENSION_ID: ${{ secrets.FIREFOX_EXTENSION_ID }}
          FIREFOX_JWT_ISSUER: ${{ secrets.FIREFOX_JWT_ISSUER }}
          FIREFOX_JWT_SECRET: ${{ secrets.FIREFOX_JWT_SECRET }}
