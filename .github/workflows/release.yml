  submit-firefox:
    name: Submit Firefox
    runs-on: ubuntu-latest
    needs: [build]
    environment: Production
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup
        uses: ./.github/workflows/setup
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Download Firefox artifact
        uses: actions/download-artifact@v7
        with:
          name: firefox-${{ github.ref_name }}
          path: build

      - name: Download source artifact
        uses: actions/download-artifact@v7
        with:
          name: sources-${{ github.ref_name }}
          path: build

      - name: Dry-run Firefox submission
        run: bun run scripts/submit-firefox.ts --dry-run
        env:
          FIREFOX_ZIP: ${{ needs.build.outputs.firefox_zip }}
          FIREFOX_SOURCES_ZIP: ${{ needs.build.outputs.sources_zip }}
          FIREFOX_EXTENSION_ID: ${{ secrets.FIREFOX_EXTENSION_ID }}
          FIREFOX_JWT_ISSUER: ${{ secrets.FIREFOX_JWT_ISSUER }}
          FIREFOX_JWT_SECRET: ${{ secrets.FIREFOX_JWT_SECRET }}

      - name: Submit Firefox
        run: bun run scripts/submit-firefox.ts
        env:
          FIREFOX_ZIP: ${{ needs.build.outputs.firefox_zip }}
          FIREFOX_SOURCES_ZIP: ${{ needs.build.outputs.sources_zip }}
          FIREFOX_EXTENSION_ID: ${{ secrets.FIREFOX_EXTENSION_ID }}
          FIREFOX_JWT_ISSUER: ${{ secrets.FIREFOX_JWT_ISSUER }}
          FIREFOX_JWT_SECRET: ${{ secrets.FIREFOX_JWT_SECRET }}
